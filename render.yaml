services:
  - type: web
    name: tgboxoffice
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PORT
        value: "10000"
      - key: BOT_NAME
        value: TGBoxOffice
      - key: BOT_USERNAME
        value: TGBoxOfficeBot
